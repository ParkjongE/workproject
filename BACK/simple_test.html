<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT 로그인 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .token { font-size: 12px; color: #333; background: #f8f9fa; padding: 8px; border-radius: 4px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JWT 로그인 테스트</h1>
        
        <div class="form-group">
            <label for="username">사용자명:</label>
            <input type="text" id="username" value="admin">
        </div>
        
        <div class="form-group">
            <label for="password">비밀번호:</label>
            <input type="password" id="password" value="admin123">
        </div>
        
        <button onclick="login()">JWT 로그인</button>
        <button onclick="testConnection()">서버 연결 테스트</button>
        <button onclick="getUserProfile()">JWT 프로필 조회</button>
        <button onclick="getAdminDashboard()">관리자 대시보드</button>
        
        <div id="result" class="result" style="display: none;"></div>
        <div id="token" class="token" style="display: none;"></div>
    </div>

    <script>
        async function testConnection() {
            try {
                const response = await fetch('http://localhost:8080/api/register', {
                    method: 'GET'
                });
                showResult('서버 연결 성공!', 'success');
            } catch (error) {
                showResult('서버 연결 실패: ' + error.message, 'error');
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8080/api/jwt/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    showResult(`로그인 성공!\n사용자: ${data.user.name}`, 'success');
                    // 토큰을 로컬 스토리지에 저장
                    localStorage.setItem('jwt_token', data.token);
                    showToken(data.token);
                } else {
                    const errorData = await response.json();
                    showResult(`로그인 실패: ${errorData.error}`, 'error');
                }
            } catch (error) {
                showResult('오류: ' + error.message, 'error');
            }
        }

        async function getUserProfile() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                showResult('토큰이 없습니다. 먼저 로그인하세요.', 'error');
                return;
            }
            try {
                const response = await fetch('http://localhost:8080/api/jwt/user/profile', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    showResult('프로필 정보: ' + JSON.stringify(data, null, 2), 'success');
                } else {
                    const errorData = await response.json();
                    showResult('프로필 조회 실패: ' + (errorData.error || response.status), 'error');
                }
            } catch (error) {
                showResult('오류: ' + error.message, 'error');
            }
        }

        async function getAdminDashboard() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                showResult('토큰이 없습니다. 먼저 로그인하세요.', 'error');
                return;
            }
            try {
                const response = await fetch('http://localhost:8080/api/jwt/admin/dashboard', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    showResult('관리자 대시보드: ' + JSON.stringify(data, null, 2), 'success');
                } else {
                    const errorData = await response.json();
                    showResult('대시보드 조회 실패: ' + (errorData.error || response.status), 'error');
                }
            } catch (error) {
                showResult('오류: ' + error.message, 'error');
            }
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
        function showToken(token) {
            const tokenDiv = document.getElementById('token');
            tokenDiv.textContent = 'JWT 토큰: ' + token;
            tokenDiv.style.display = 'block';
        }
    </script>
</body>
</html>
