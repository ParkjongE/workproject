<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부서별 업무 현황</title>
  <style>
    /* (CSS는 기존 코드 그대로 유지) */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 40px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    h1 {
      font-size: 24px;
      margin-top: 30px;
      margin-bottom: 10px;
    }
    .sidebar {
      float: left;
      width: 200px;
      padding-right: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar li {
      margin: 10px 0;
      color: #333;
      cursor: pointer;
    }
    .sidebar li.active {
      font-weight: bold;
    }
    .sidebar li:first-child {
      font-size: 18px;
      font-weight: bold;
      color: #000;
      margin-bottom: 20px;
    }
    .content {
      margin-left: 220px;
    }
    .highlight-button {
      background-color: #d5f5d5;
      border: 1px solid #8bc34a;
      border-radius: 12px;
      padding: 5px 15px;
      display: inline-block;
      margin-bottom: 20px;
      font-size: 14px;
      color: #333;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
    }
    .department-select {
      background-color: #d5f5d5;
      border: 1px solid #8bc34a;
      border-radius: 12px;
      padding: 5px 15px;
      font-size: 14px;
      color: #333;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      outline: none;
    }
    .department-select option {
      background-color: white;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 150px;
    }
    th, td {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th:first-child, td:first-child {
      border-left: 1px solid #ccc;
    }
    th {
      border-top: 1px solid #ccc;
      background-color: #f1f1f1;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <ul>
        <li>조직관리</li>
        <li class="active">부서별 업무 현황 조회</li>
        <li onclick="location.href='/orgmember'">구성원 관리</li>
        <li onclick="location.href='/orgchart'">조직도</li>
      </ul>
    </div>
    <div class="content">
      <h1>부서별 업무 현황</h1>
      <select class="department-select" onchange="loadDepartment(this.value)">
        <option value="영업부">영업부</option>
        <option value="기술부">기술부</option>
        <option value="마케팅부">마케팅부</option>
        <option value="인사부">인사부</option>
        <option value="경영부">경영부</option>
      </select>
      <table id="statusTable">
        <thead>
          <tr>
            <th>부서명</th>
            <th>팀명</th>
            <th>팀장</th>
            <th>인원 수</th>
            <th>담당 업무</th>
            <th>진행중인 업무 / 프로젝트</th>
            <th>마감기한</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="7">데이터 로드 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div style="clear: both;"></div>
  </div>

  <script>
    // 부서 목록을 가져와서 콤보상자에 추가하는 함수
    function loadDepartments() {
      fetch('http://localhost:8080/api/departments')
        .then(response => response.json())
        .then(data => {
          const select = document.querySelector('.department-select');
          select.innerHTML = ''; // 기존 옵션 제거
          
          // 기본 옵션 추가
          const defaultOption = document.createElement('option');
          defaultOption.value = '';
          defaultOption.textContent = '부서를 선택하세요';
          select.appendChild(defaultOption);
          
          // API에서 가져온 부서 목록 추가
          data.departments.forEach(dept => {
            const option = document.createElement('option');
            option.value = dept;
            option.textContent = dept;
            select.appendChild(option);
          });
          
          // 첫 번째 부서를 기본으로 선택하고 데이터 로드
          if (data.departments.length > 0) {
            select.value = data.departments[0];
            loadDepartment(data.departments[0]);
          }
        })
        .catch(error => {
          console.error("부서 목록 로드 실패:", error);
        });
    }

    function loadDepartment(departmentName) {
      if (!departmentName) return; // 빈 값이면 리턴
      
      fetch(`http://localhost:8080/api/departments/status/${encodeURIComponent(departmentName)}`)
        .then(response => response.json())
        .then(data => {
          const tbody = document.querySelector("#statusTable tbody");
          tbody.innerHTML = ""; // 기존 내용 제거

          const rows = Array.isArray(data) ? data : [data];

          rows.forEach(item => {
            const row = `
              <tr>
                <td>${item.department_name}</td>
                <td>${item.team_name}</td>
                <td>${item.team_lead}</td>
                <td>${item.member_count}</td>
                <td>${item.tasks}</td>
                <td>${item.ongoing_project}</td>
                <td>${item.deadline}</td>
              </tr>`;
            tbody.insertAdjacentHTML("beforeend", row);
          });
        })
        .catch(error => {
          console.error("API 호출 실패:", error);
          const tbody = document.querySelector("#statusTable tbody");
          tbody.innerHTML = `<tr><td colspan="7">데이터를 불러오지 못했습니다.</td></tr>`;
        });
    }

    // 페이지 로드 시 부서 목록 로드
    window.onload = () => loadDepartments();
  </script>
</body>
</html>
