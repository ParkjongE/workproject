<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>팀 일정 공유</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    .container { max-width: 1200px; margin: 30px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1); position: relative; display: flex; min-height: 700px; }
    .sidebar { width: 220px; background: #f5f5f5; border-right: 1px solid #e0e0e0; min-height: 700px; display: flex; flex-direction: column; justify-content: flex-start; padding: 0; }
    .sidebar ul { list-style: none; padding: 36px 0 0 20px; margin: 0; }
    .sidebar li { margin: 18px 0; color: #333; cursor: pointer; font-size: 17px; font-weight: normal; transition: font-weight 0.2s; user-select: none; }
    .sidebar li.active { font-weight: bold; color: #218838; }
    .sidebar .submenu { display: none; margin-left: 12px; }
    .sidebar .submenu.show { display: block; }
    .sidebar .submenu li { font-size: 16px; color: #444; margin: 8px 0; font-weight: normal; }
    .sidebar .submenu li.active { font-weight: bold; color: #218838; }
    .main-content { flex: 1; padding: 40px 40px 40px 40px; }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 48px 48px;
      justify-items: center;
      margin-top: 60px;
    }
    .team-card {
      background: #ddd;
      border-radius: 8px;
      width: 380px;
      height: 180px;
      padding: 18px 22px 18px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .team-card:hover {
      box-shadow: 0 6px 18px rgba(33,136,56,0.18);
      transform: translateY(-4px) scale(1.03);
    }
    .team-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #222;
    }
    .task-list {
      margin: 0 0 0 0;
      padding: 0;
      list-style: none;
      font-size: 15px;
      color: #234fa0;
    }
    .task-list li {
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deadline {
      color: #e74c3c;
      font-size: 13px;
      margin-left: 8px;
    }
    .more {
      position: absolute;
      right: 18px;
      bottom: 14px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="sidebar">
      <ul>
        <li id="commuteMenu">출퇴근/근태 관리
          <ul class="submenu" id="commuteSubmenu">
            <li onclick="location.href='/commute'">출퇴근 기록</li>
            <li onclick="location.href='/leave_apply'">휴가/조퇴/외출 신청</li>
            <li onclick="location.href='/my_attendance'">내 근태내역</li>
          </ul>
        </li>
        <li onclick="location.href='#'">내 일정관리</li>
        <li style="font-size:19px; font-weight:bold; color:#000; margin-bottom:28px; cursor:pointer;" onclick="location.href='/team_schedule'">팀 일정 공유</li>
        <li id="orgMenu">조직관리
          <ul class="submenu" id="orgSubmenu">
            <li onclick="location.href='/orgchart'">조직도</li>
            <li onclick="location.href='/dep_work'">부서별 업무 현황 조회</li>
            <li onclick="location.href='/orgmember'">구성원 관리</li>
          </ul>
        </li>
      </ul>
    </nav>
    <div class="main-content">
      <h2 style="margin-left:10px; color:#218838;">팀 일정 공유</h2>
      <div class="team-grid" id="teamGrid"></div>
      <div id="teamDetail" style="display:none;"></div>
    </div>
  </div>
  <script>
    // 출퇴근/근태 관리 클릭 시 하위 메뉴 토글
    document.getElementById('commuteMenu') && document.getElementById('commuteMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('commuteSubmenu');
      submenu.classList.toggle('show');
    });
    // 조직관리 하위메뉴 토글
    document.getElementById('orgMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('orgSubmenu');
      submenu.classList.toggle('show');
    });
    // 예시 데이터
    const teams = [
      {
        name: '개발1팀',
        leader: '홍길동',
        members: ['홍길동', '박주호', '이민수', '최수진'],
        tasks: [
          { title: '신규 서비스 런칭', deadline: '2024-08-10' },
          { title: 'API 리팩토링', deadline: '2024-08-20' },
          { title: '버그 수정', deadline: '2024-08-25' }
        ]
      },
      {
        name: '개발2팀',
        leader: '김지훈',
        members: ['김지훈', '정유진', '오세훈', '한지민'],
        tasks: [
          { title: '앱 디자인 개선', deadline: '2024-08-12' },
          { title: '로그인 기능 개선', deadline: '2024-08-18' }
        ]
      },
      {
        name: '영업1팀',
        leader: '이수진',
        members: ['이수진', '박성호', '최민지'],
        tasks: [
          { title: '고객사 미팅', deadline: '2024-08-09' },
          { title: '신규 계약 추진', deadline: '2024-08-22' }
        ]
      },
      {
        name: '영업2팀',
        leader: '정다은',
        members: ['정다은', '이준호'],
        tasks: [
          { title: '시장조사', deadline: '2024-08-15' }
        ]
      }
    ];

    const grid = document.getElementById('teamGrid');
    const detail = document.getElementById('teamDetail');

    function showTeamList() {
      grid.style.display = '';
      detail.style.display = 'none';
    }

    function showTeamDetail(team) {
      grid.style.display = 'none';
      detail.style.display = '';
      // 예시 일정 데이터 (팀원별 휴가/업무)
      const memberSchedules = {
        '홍길동': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-13'], leave: ['2024-08-12'] },
        '박주호': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '이민수': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '최수진': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '김지훈': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '정유진': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '오세훈': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '한지민': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '이수진': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '박성호': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '최민지': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '정다은': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
        '이준호': { work: ['2024-08-01','2024-08-02','2024-08-05','2024-08-06','2024-08-07','2024-08-08','2024-08-09','2024-08-12','2024-08-13'], leave: [] },
      };
      // 달력 생성 함수 (미니/상세 구분)
      function makeCalendar(year, month, member, mini, calendarWidth) {
        const today = new Date();
        const firstDay = new Date(year, month-1, 1).getDay();
        const lastDate = new Date(year, month, 0).getDate();
        let html = `<table class="calendar-table" style="width:${mini?'20px':'48px'}; border-collapse:collapse; margin:8px 0; font-size:${mini?'0.65rem':'0.95rem'};">`;
        html += '<tr style="background:#f5f5f5;"><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>';
        for(let i=0; i<firstDay; i++) html += '<td></td>';
        for(let d=1; d<=lastDate; d++) {
          const dateStr = `${year}-08-${d.toString().padStart(2,'0')}`;
          let style = '';
          if(memberSchedules[member]?.leave.includes(dateStr)) style = 'background:#ffe0e0; color:#c0392b; font-weight:bold;';
          else if(memberSchedules[member]?.work.includes(dateStr)) style = 'background:#e3eafc; color:#234fa0;';
          html += `<td style='${style} text-align:center; height:${mini?'8px':'18px'};'>${d}</td>`;
          if((firstDay+d)%7===0) html += '</tr><tr>';
        }
        html += '</tr></table>';
        return html;
      }
      // SVG 시계형 시간표 (미니/상세 구분)
      function clockSVG(isLeave, mini, clockWidth) {
        const size = mini ? 80 : 160;
        const stroke = mini ? 8 : 16;
        const r = mini ? (size/2 - stroke/2 - 2) : (size/2 - stroke/2 - 4);
        const r2 = mini ? (r - 4) : (r - 8);
        if(isLeave) {
          return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e74c3c" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r2}" fill="#ffe0e0"/></svg>`;
        } else {
          // 9~18시(9시간) = 270도(3/4원)
          const startX = size/2;
          const startY = size/2 - r;
          const endX = size - stroke/2;
          const endY = size/2;
          const largeArcFlag = 1;
          return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#eee" stroke-width="${stroke}" fill="none"/><path d="M${startX} ${startY} A${r} ${r} 0 ${largeArcFlag} 1 ${endX} ${endY}" stroke="#218838" stroke-width="${stroke}" fill="none" stroke-linecap="round"/><circle cx="${size/2}" cy="${size/2}" r="${r2}" fill="#ffe0e0"/></svg>`;
        }
      }
      // 미니 뷰 렌더링
      function renderMiniMembers() {
        detail.innerHTML = `
          <div style="max-width:900px; margin:40px auto; background:#f5f5f5; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:48px 40px; text-align:center;">
            <button onclick="showTeamList()" style="float:right; background:#218838; color:#fff; border:none; border-radius:6px; padding:6px 18px; font-size:15px; font-weight:bold; cursor:pointer;">목록으로</button>
            <div style="font-size:2.2rem; font-weight:bold; color:#218838; margin-bottom:32px;">${team.name}</div>
            <div style="display:flex; flex-wrap:wrap; gap:32px; justify-content:center; align-items:flex-end; margin-top:24px;">
              ${team.members.map(name => {
                const isLeave = memberSchedules[name]?.leave.includes('2024-08-12');
                return `
                  <div onclick="showMemberDetail('${name.replace(/'/g, '\'')}')" style="display:flex; flex-direction:column; align-items:center; min-width:90px; cursor:pointer;">
                    <div style="font-size:1.02rem; font-weight:bold; margin-bottom:6px; ${name===team.leader?'color:#218838;':''}">${name}${name===team.leader?'(팀장)':''}</div>
                    <div style="display:flex; flex-direction:row; align-items:center; gap:4px;">
                      <div>${clockSVG(isLeave, true, 80)}</div>
                      <div>${makeCalendar(2024,8,name,true,36)}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }
      // 상세 뷰 렌더링
      window.showMemberDetail = function(name) {
        const isLeave = memberSchedules[name]?.leave.includes('2024-08-12');
        detail.innerHTML = `
          <div style="max-width:600px; margin:40px auto; background:#f5f5f5; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:48px 40px; text-align:center;">
            <button onclick="window.renderMiniMembers()" style="float:right; background:#218838; color:#fff; border:none; border-radius:6px; padding:6px 18px; font-size:15px; font-weight:bold; cursor:pointer;">팀원 전체 보기</button>
            <div style="font-size:1.7rem; font-weight:bold; color:#218838; margin-bottom:24px;">${name}</div>
            <div style="display:flex; align-items:center; justify-content:center; gap:36px; margin-bottom:18px;">
              <div>${clockSVG(isLeave, false)}</div>
              <div>${makeCalendar(2024,8,name,false)}</div>
            </div>
            <div style="margin-bottom:10px; font-size:1.1rem; color:#888;">${isLeave?'휴가':'09:00~18:00'}</div>
          </div>
        `;
      }
      // 최초 미니 뷰 렌더링 함수 전역 등록
      window.renderMiniMembers = renderMiniMembers;
      renderMiniMembers();
    }

    // 카드 목록 생성 함수 (초기화 및 목록 복귀 시 사용)
    function renderTeamCards() {
      grid.innerHTML = '';
      teams.forEach(team => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.onclick = () => showTeamDetail(team);
        const memberList = team.members.map(name =>
          name === team.leader
            ? `<span style='color:#218838; font-weight:bold;'>${name}(팀장)</span>`
            : `<span>${name}</span>`
        ).join(', ');
        card.innerHTML = `
          <div class="team-title">${team.name}</div>
          <ul class="task-list">
            ${team.tasks.slice(0,3).map(task => `
              <li>
                <span>${task.title}</span>
                <span class="deadline">${task.deadline}</span>
              </li>
            `).join('')}
          </ul>
          <div class="more">${team.tasks.length > 3 ? '외 ' + (team.tasks.length-3) + '건 더 있음' : '&nbsp;'}</div>
          <div style="margin-top:auto; font-size:14px; color:#333; padding-top:10px;">팀원: ${memberList}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 전역에서 접근 가능하게 함수 등록
    window.showTeamList = showTeamList;

    // 최초 카드 목록 렌더링
    renderTeamCards();
  </script>
</body>
</html>
