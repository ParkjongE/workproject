<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>휴가/조퇴/외출 신청</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    .container { max-width: 1100px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 0; display: flex; }
    .sidebar { width: 220px; background: #f5f5f5; border-right: 1px solid #e0e0e0; border-radius: 10px 0 0 10px; padding: 36px 0 0 0; min-height: 700px; }
    .sidebar ul { list-style: none; padding: 0 0 0 24px; margin: 0; }
    .sidebar li { margin: 18px 0; color: #333; cursor: pointer; font-size: 17px; font-weight: normal; transition: font-weight 0.2s; user-select: none; }
    .sidebar li.active { font-weight: bold; color: #218838; }
    .sidebar li:first-child { font-size: 19px; font-weight: bold; color: #000; margin-bottom: 28px; }
    .sidebar .submenu { display: none; margin-left: 12px; }
    .sidebar .submenu.show { display: block; }
    .sidebar .submenu li { font-size: 16px; color: #444; margin: 8px 0; font-weight: normal; }
    .sidebar .submenu li.active {
      font-weight: bold;
      color: #218838;
    }
    .main-content { flex: 1; padding: 40px 40px 40px 40px; }
    h2 { font-size: 24px; font-weight: bold; margin-bottom: 18px; color: #218838; }
    form { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
    label { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    select, input[type="date"], input[type="time"], textarea { font-size: 15px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; }
    textarea { resize: vertical; min-height: 60px; }
    button { background: #218838; color: #fff; border: none; border-radius: 8px; padding: 12px 0; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .history { margin-top: 30px; }
    .history-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #234fa0; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border: 1px solid #eee; padding: 8px 6px; text-align: center; }
    th { background: #f5f5f5; }
    tr:nth-child(even) { background: #fafafa; }
    .upload-row {
      display: flex;
      gap: 32px;
      margin-bottom: 28px;
    }
    .upload-item {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .upload-item label {
      margin-bottom: 8px; /* 원하는 만큼 숫자 조절 (예: 4~8px) */
    }
    @media (max-width: 900px) {
      .container { flex-direction: column; max-width: 100vw; }
      .sidebar { width: 100vw; border-radius: 10px 10px 0 0; min-height: unset; }
      .main-content { padding: 24px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="sidebar">
      <ul>
        <li class="active" id="commuteMenu">출퇴근/근태 관리
          <ul class="submenu" id="commuteSubmenu">
            <li onclick="location.href='/commute'">출퇴근 기록</li>
            <li class="active" onclick="location.href='/leave_apply'">휴가/조퇴/외출 신청</li>
            <li onclick="location.href='/my_attendance'">내 근태내역</li>
          </ul>
        </li>
        <li onclick="location.href='/team_schedule'">팀 일정 공유</li>
        <li id="orgMenu">조직관리
          <ul class="submenu" id="orgSubmenu">
            <li onclick="location.href='/orgchart'">조직도</li>
            <li onclick="location.href='/dep_work'">부서별 업무 현황 조회</li>
            <li onclick="location.href='/orgmember'">구성원 관리</li>
          </ul>
        </li>
      </ul>
    </nav>
    <div class="main-content">
      <h2>휴가/조퇴/외출 신청</h2>
      <form id="leaveForm">
        <label>신청 종류
          <select name="type" id="leaveTypeSelect" required>
            <option value="">선택하세요</option>
            <option value="연차">연차</option>
            <option value="반차">반차</option>
            <option value="조퇴">조퇴</option>
            <option value="외출">외출</option>
            <option value="출산휴가">출산휴가</option>
            <option value="배우자출산휴가">배우자출산휴가</option>
            <option value="육아휴직">육아휴직</option>
            <option value="가족돌봄휴가">가족돌봄휴가</option>
            <option value="병가">병가</option>
          </select>
          <span id="annualInfo" style="margin-left:12px; color:#218838; font-size:15px; display:none;">신청 가능한 연차: 8일</span>
        </label>
        <label>신청 날짜
          <input type="date" name="date" required />
        </label>
        <label>시간(조퇴/외출 시)
          <input type="time" name="time" />
        </label>
        <label>사유
          <textarea name="reason" placeholder="사유를 입력하세요" required></textarea>
        </label>
        <div class="upload-row">
          <div class="upload-item">
            <label style="font-size:16px; font-weight:500;">신청서 업로드</label>
            <input type="file" name="applicationFile" style="margin-top:0px;">
          </div>
          <div class="upload-item">
            <label style="font-size:16px; font-weight:500;">제출서류 업로드</label>
            <input type="file" name="submitFile" style="margin-top:0px;">
          </div>
        </div>
        <button type="submit" style="background:#218838; color:#fff; border:none; border-radius:8px; padding:12px 40px; font-size:18px; font-weight:bold; cursor:pointer;">신청하기</button>
      </form>
      <div class="history">
        <div class="history-title">최근 신청 내역</div>
        <table>
          <tr>
            <th>신청일</th>
            <th>종류</th>
            <th>날짜</th>
            <th>시간</th>
            <th>사유</th>
            <th>상태</th>
          </tr>
          <tr>
            <td>2024-07-10</td>
            <td>연차</td>
            <td>2024-07-15</td>
            <td>-</td>
            <td>여행</td>
            <td>승인</td>
          </tr>
          <tr>
            <td>2024-07-08</td>
            <td>조퇴</td>
            <td>2024-07-08</td>
            <td>15:00</td>
            <td>병원진료</td>
            <td>대기</td>
          </tr>
          <tr>
            <td>2024-07-05</td>
            <td>외출</td>
            <td>2024-07-05</td>
            <td>11:00</td>
            <td>은행업무</td>
            <td>승인</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('leaveForm').onsubmit = function(e) {
      e.preventDefault();
      alert('신청이 완료되었습니다!');
      // 실제로는 서버로 데이터 전송 및 내역 갱신 필요
    };
    // 출퇴근/근태 관리 클릭 시 하위 메뉴 토글
    document.getElementById('commuteMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('commuteSubmenu');
      submenu.classList.toggle('show');
    });
    // 조직관리 하위메뉴 토글
    document.getElementById('orgMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('orgSubmenu');
      submenu.classList.toggle('show');
    });
    // 연차(휴가) 선택 시 안내문구 표시
    document.getElementById('leaveTypeSelect').addEventListener('change', function() {
      var info = document.getElementById('annualInfo');
      if (this.value === '연차') {
        info.style.display = 'inline';
      } else {
        info.style.display = 'none';
      }
    });
  </script>
</body>
</html>
