<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>구성원 관리</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      min-height: 700px;
    }
    .sidebar {
      width: 220px;
      background: #f5f5f5;
      border-right: 1px solid #e0e0e0;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .sidebar ul {
      list-style: none;
      padding: 36px 0 0 20px;
      margin: 0;
    }
    .sidebar li {
      margin: 18px 0;
      color: #333;
      cursor: pointer;
      font-size: 17px;
      font-weight: normal;
      transition: font-weight 0.2s;
      user-select: none;
    }
    .sidebar li.active {
      font-weight: bold;
      color: #218838;
    }
    .sidebar li.sidebar-title {
      font-size: 19px;
      font-weight: bold;
      color: #000;
      margin-bottom: 28px;
    }
    .sidebar .submenu {
      display: none;
      margin-left: 12px;
    }
    .sidebar .submenu.show {
      display: block;
    }
    .sidebar .submenu li {
      font-size: 16px;
      color: #444;
      margin: 8px 0;
      font-weight: normal;
    }
    .sidebar .submenu li.active {
      font-weight: bold;
      color: #218838;
    }
    .main-content {
      flex: 1;
      padding: 40px 40px 40px 40px;
    }
    .top-actions {
      position: absolute;
      top: 18px;
      right: 12px;
      display: flex;
      gap: 12px;
    }
    .action-btn {
      background: #218838;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 500;
      padding: 8px 24px;
      cursor: pointer;
      color: #fff;
      font-family: 'Inter', Arial, sans-serif;
      transition: background 0.2s;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      margin-top: 30px;
      margin-bottom: 24px;
      color: #000;
    }
    .search-sort-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #f1f1f1;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      height: 48px;
      min-width: 320px;
      flex: 1;
      max-width: 400px;
    }
    .search-box input {
      border: none;
      background: transparent;
      color: #222;
      font-size: 18px;
      outline: none;
      width: 100%;
      margin-right: 10px;
      padding: 0 4px;
      border-radius: 6px;
    }
    .search-box input::placeholder {
      color: #888;
      opacity: 1;
    }
    .search-box button {
      background: #218838;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 12px;
      transition: background 0.2s;
    }
    .search-box button:hover {
      background: #17692c;
    }
    .sort-group-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #000;
      border-radius: 16px;
      height: 44px;
      padding: 0 20px;
      gap: 20px;
    }
    .sort-group-box span {
      font-family: 'Comfortaa', Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #000;
      cursor: pointer;
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px 16px;
      justify-content: flex-start;
      margin-top: 24px;
    }
    .member-card {
      width: 240px;
      min-width: 200px;
      height: 300px;
      background: #fff;
      border: 1px solid #000;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      font-size: 14px;
      padding: 12px 8px 16px 8px;
    }
    .member-photo {
      width: 70px;
      height: 70px;
      background: #D9D9D9;
      border-radius: 50%;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #888;
    }
    .member-info {
      width: 100%;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
    }
    .member-info-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: #000;
      flex-wrap: wrap;
    }
    .member-info-row .label {
      width: 38px;
      color: #888;
      font-size: 12px;
      font-weight: 400;
      flex-shrink: 0;
    }
    .member-status, .edit-btn {
      position: static;
      display: inline-block;
      margin: 0 4px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 12px;
      padding: 2px 12px;
      border: none;
    }
    .member-status {
      background: #218838;
      color: #fff;
      margin-top: 8px;
    }
    .edit-btn {
      background: #218838;
      color: #fff;
      margin-top: 8px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .edit-btn:hover {
      background: #17692c;
    }
    .member-card-bottom {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: auto;
    }
    .department-select {
      background-color: #218838;
      border: none;
      border-radius: 12px;
      padding: 5px 15px;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      outline: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .department-select option {
      background-color: #fff;
      color: #333;
    }
    button, .btn {
      background: #218838;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, .btn:hover {
      background: #17692c;
    }
    @media (max-width: 1200px) {
      .container { flex-direction: column; max-width: 100vw; }
      .sidebar { width: 100vw; min-height: unset; padding-right: 0; }
      .main-content { margin-left: 0; padding: 24px 8px; }
      .member-list { gap: 16px 4px; }
      .member-card { width: 95vw; min-width: 160px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="sidebar">
      <ul>
        <li id="commuteMenu">출퇴근/근태 관리
          <ul class="submenu" id="commuteSubmenu">
            <li onclick="location.href='/commute'">출퇴근 기록</li>
            <li onclick="location.href='/leave_apply'">휴가/조퇴/외출 신청</li>
            <li onclick="location.href='/my_attendance'">내 근태내역</li>
          </ul>
        </li>
        <li>내 일정관리</li>
        <li onclick="location.href='/team_schedule'">팀 일정 공유</li>
        <li class="sidebar-title active" id="orgMenu">조직관리
          <ul class="submenu show" id="orgSubmenu">
            <li onclick="location.href='/orgchart'">조직도</li>
            <li onclick="location.href='/dep_work'">부서별 업무 현황 조회</li>
            <li class="active" onclick="location.href='/orgmember.html'">구성원 관리</li>
          </ul>
        </li>
      </ul>
    </nav>
    <div class="main-content">
      <div class="top-actions">
        <button class="action-btn">부서 관리</button>
        <button class="action-btn">편집</button>
      </div>
      <div class="title">구성원 관리</div>
      <div class="search-sort-row">
        <div class="search-box">
          <input type="text" placeholder="검색" />
          <button aria-label="검색">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="10" r="7" stroke="white" stroke-width="2"/>
              <line x1="16" y1="16" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sort-group-box">
          <span>정렬 기준</span>
          <span>그룹화</span>
        </div>
      </div>
      <div class="member-list">
        <div class="member-card">
          <div class="member-photo">사진</div>
          <div class="member-info">
            <div class="member-info-row"><span class="label">이름</span>홍길동</div>
            <div class="member-info-row"><span class="label">사번</span>20240001</div>
            <div class="member-info-row"><span class="label">팀</span>인사팀</div>
            <div class="member-info-row"><span class="label">직책</span>사원</div>
            <div class="member-info-row"><span class="label">email</span>hong@company.com</div>
            <div class="member-info-row"><span class="label">입사일</span>2024-01-01</div>
          </div>
          <div class="member-card-bottom">
            <span class="member-status">휴직</span>
            <button class="edit-btn">편집</button>
          </div>
        </div>
        <div class="member-card">
          <div class="member-photo">사진</div>
          <div class="member-info">
            <div class="member-info-row"><span class="label">이름</span>김철수</div>
            <div class="member-info-row"><span class="label">사번</span>20240002</div>
            <div class="member-info-row"><span class="label">팀</span>총무팀</div>
            <div class="member-info-row"><span class="label">직책</span>대리</div>
            <div class="member-info-row"><span class="label">email</span>kim@company.com</div>
            <div class="member-info-row"><span class="label">입사일</span>2023-03-15</div>
          </div>
          <div class="member-card-bottom">
            <span class="member-status">재직</span>
            <button class="edit-btn">편집</button>
          </div>
        </div>
        <!-- 더미 구성원 카드 추가 가능 -->
      </div>
    </div>
  </div>
  <script>
    // 조직관리 클릭 시 하위 메뉴 토글
    document.getElementById('orgMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('orgSubmenu');
      submenu.classList.toggle('show');
    });
    // 출퇴근/근태 관리 클릭 시 하위 메뉴 토글
    document.getElementById('commuteMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('commuteSubmenu');
      submenu.classList.toggle('show');
    });
  </script>
</body>
</html>
