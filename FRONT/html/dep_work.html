<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부서별 업무 현황</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 1500px;
      margin: 20px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      min-height: 800px;
    }
    .sidebar {
      width: 240px;
      background: #f5f5f5;
      border-right: 1px solid #e0e0e0;
      min-height: 800px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .sidebar ul {
      list-style: none;
      padding: 36px 0 0 20px;
      margin: 0;
    }
    .sidebar li {
      margin: 18px 0;
      color: #333;
      cursor: pointer;
      font-size: 17px;
      font-weight: normal;
      transition: font-weight 0.2s;
      user-select: none;
    }
    .sidebar li.active {
      font-weight: bold;
      color: #218838;
    }
    .sidebar li.sidebar-title {
      font-size: 19px;
      font-weight: bold;
      color: #000;
      margin-bottom: 28px;
    }
    .sidebar .submenu {
      display: none;
      margin-left: 12px;
    }
    .sidebar .submenu.show {
      display: block;
    }
    .sidebar .submenu li {
      font-size: 16px;
      color: #444;
      margin: 8px 0;
      font-weight: normal;
    }
    .sidebar .submenu li.active {
      font-weight: bold;
      color: #218838;
    }
    .main-content {
      flex: 1;
      padding: 40px 30px 50px 50px;
      overflow-x: auto;
    }
    @media (max-width: 1200px) {
      .container { flex-direction: column; max-width: 100vw; }
      .sidebar { width: 100vw; min-height: unset; padding-right: 0; }
      .main-content { margin-left: 0; padding: 24px 8px; }
    }
    h1 {
      font-size: 26px;
      margin-top: 20px;
      margin-bottom: 20px;
      color: #333;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      position: relative;
    }
    .department-select {
      background-color: #218838;
      border: none;
      border-radius: 12px;
      padding: 8px 20px;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      outline: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .department-select:hover {
      background-color: #1e7e34;
    }
    .department-select option {
      background-color: #fff;
      color: #333;
      padding: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 15px;
      table-layout: fixed;
    }
    
    th, td {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      padding: 14px 6px;
      text-align: center;
      vertical-align: middle;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.4;
    }
    
    /* 우선순위와 진행상태 셀에 더 많은 여백 제공 */
    td:nth-child(8), td:nth-child(9) {
      padding: 14px 6px;
      text-align: center;
    }
    
    /* 배지를 감싸는 컨테이너 추가 */
    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      text-align: center;
    }
    
    .priority-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 15px;
      font-weight: bold;
      min-width: 90px;
      white-space: nowrap;
      text-align: center;
    }
    
    .status-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 15px;
      font-weight: normal;
      min-width: 80px;
      white-space: nowrap;
      text-align: center;
    }
    th:first-child, td:first-child {
      border-left: 1px solid #ccc;
    }
    tr {
      min-height: 60px;
    }
    
    th {
      border-top: 1px solid #ccc;
      background-color: #f1f1f1;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px 8px;
    }
    /* 열 너비 조정 */
    th:nth-child(1), td:nth-child(1) { width: 6%; } /* 부서명 */
    th:nth-child(2), td:nth-child(2) { width: 6%; } /* 팀명 */
    th:nth-child(3), td:nth-child(3) { width: 6%; } /* 팀장 */
    th:nth-child(4), td:nth-child(4) { width: 4%; } /* 인원 수 */
    th:nth-child(5), td:nth-child(5) { width: 12%; } /* 주요 담당 업무 */
    th:nth-child(6), td:nth-child(6) { width: 12%; } /* 업무명 */
    th:nth-child(7), td:nth-child(7) { width: 7%; } /* 업무 담당자 */
    th:nth-child(8), td:nth-child(8) { width: 14%; } /* 진행 상태 */
    th:nth-child(9), td:nth-child(9) { width: 14%; } /* 우선순위 */
    th:nth-child(10), td:nth-child(10) { width: 9.5%; } /* 시작일 */
    th:nth-child(11), td:nth-child(11) { width: 9.5%; } /* 마감일 */
    
    tr:nth-child(even) {
      background-color: #fafafa;
    }
    .priority-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 15px;
      font-weight: bold;
      min-width: 100px;
      white-space: nowrap;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .priority-urgent {
      background-color: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
    }
    .priority-medium {
      background-color: #fff3e0;
      color: #ef6c00;
      border: 1px solid #ffe0b2;
    }
    .priority-low {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 15px;
      font-weight: normal;
      min-width: 90px;
      white-space: nowrap;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .status-progress {
      background-color: #e3f2fd;
      color: #1976d2;
      border: 1px solid #bbdefb;
    }
    .status-completed {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .status-delayed {
      background-color: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>
  <script>
    document.getElementById('aa').innerHTML = "b";
  </script>
<body>
  <div class="container">
    <nav class="sidebar">
      <ul>
        <li id="commuteMenu">출퇴근/근태 관리
          <ul class="submenu" id="commuteSubmenu">
            <li onclick="location.href='/commute'">출퇴근 기록</li>
            <li onclick="location.href='/leave_apply'">휴가/조퇴/외출 신청</li>
            <li onclick="location.href='/my_attendance'">내 근태내역</li>
          </ul>
        </li>
        <li>내 일정관리</li>
        <li onclick="location.href='/team_schedule'">팀 일정 공유</li>
        <li class="sidebar-title active" id="orgMenu">조직관리
          <ul class="submenu show" id="orgSubmenu">
            <li onclick="location.href='/orgchart'">조직도</li>
            <li class="active" onclick="location.href='/dep_work'">부서별 업무 현황 조회</li>
            <li onclick="location.href='/orgmember'">구성원 관리</li>
          </ul>
        </li>
      </ul>
    </nav>
    <div class="main-content">
      <div class="header-container">
        <h1>부서별 업무 현황</h1>
        <select class="department-select" onchange="loadDepartment(this.value)">
          <option value="개발팀">개발팀</option>
          <option value="디자인팀">디자인팀</option>
          <option value="마케팅팀">마케팅팀</option>
        </select>
      </div>
      <table id="statusTable">
        <thead>
          <tr>
            <th>부서명</th>
            <th>팀명</th>
            <th>팀장</th>
            <th>인원 수</th>
            <th>주요 담당 업무</th>
            <th>업무명</th>
            <th>업무 담당자</th>
            <th>진행 상태</th>
            <th>우선순위</th>
            <th>시작일</th>
            <th>마감일</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="11">데이터 로드 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div id = "aa">a</div>
  </div>

  <script>


    
    // 출퇴근/근태 관리 클릭 시 하위 메뉴 토글
    document.getElementById('commuteMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('commuteSubmenu');
      submenu.classList.toggle('show');
    });

    // 조직관리 클릭 시 하위 메뉴 토글
    document.getElementById('orgMenu').addEventListener('click', function(e) {
      if (e.target !== this) return;
      var submenu = document.getElementById('orgSubmenu');
      submenu.classList.toggle('show');
    });


    // 부서 목록을 가져와서 콤보상자에 추가하는 함수
    function loadDepartments() {
      fetch('http://localhost:8080/api/departments')
        .then(response => response.json())
        .then(data => {
          const select = document.querySelector('.department-select');
          select.innerHTML = ''; // 기존 옵션 제거
          
          // 기본 옵션 추가
          const defaultOption = document.createElement('option');
          defaultOption.value = '';
          defaultOption.textContent = '부서를 선택하세요';
          select.appendChild(defaultOption);
          
          // API에서 가져온 부서 목록 추가
          data.departments.forEach(dept => {
            const option = document.createElement('option');
            option.value = dept;
            option.textContent = dept;
            select.appendChild(option);
          });
          
          // 첫 번째 부서를 기본으로 선택하고 데이터 로드
          if (data.departments.length > 0) {
            select.value = data.departments[0];
            loadDepartment(data.departments[0]);
          }
        })
        .catch(error => {
          console.error("부서 목록 로드 실패:", error);
        });
    }

    // 상태에 따른 배지 클래스 반환
    function getStatusClass(status) {
      switch(status) {
        case '진행중': return 'status-progress';
        case '완료': return 'status-completed';
        case '지연': return 'status-delayed';
        default: return '';
      }
    }

    // 우선순위에 따른 배지 클래스 반환
    function getPriorityClass(priority) {
      if (priority.includes('🔴')) return 'priority-urgent';
      if (priority.includes('🟠')) return 'priority-medium';
      if (priority.includes('🟢')) return 'priority-low';
      return '';
    }

    function loadDepartment(departmentName) {
      if (!departmentName) return; // 빈 값이면 리턴
      
      fetch(`http://localhost:8080/api/departments/status/${encodeURIComponent(departmentName)}`)
        .then(response => response.json())
        .then(data => {
          const tbody = document.querySelector("#statusTable tbody");
          tbody.innerHTML = ""; // 기존 내용 제거

          const rows = Array.isArray(data) ? data : [data];

          rows.forEach(item => {
            const statusClass = getStatusClass(item.status);
            const priorityClass = getPriorityClass(item.priority);
            
            const row = `
              <tr>
                <td>${item.department_name}</td>
                <td>${item.team_name}</td>
                <td>${item.team_lead}</td>
                <td>${item.member_count}</td>
                <td>${item.main_tasks}</td>
                <td>${item.task_name}</td>
                <td>${item.task_assignee}</td>
                <td><div class="badge-container"><span class="status-badge ${statusClass}">${item.status}</span></div></td>
                <td><div class="badge-container"><span class="priority-badge ${priorityClass}">${item.priority}</span></div></td>
                <td>${item.start_date}</td>
                <td>${item.deadline}</td>
              </tr>`;
            tbody.insertAdjacentHTML("beforeend", row);
          });
        })
        .catch(error => {
          console.error("API 호출 실패:", error);
          const tbody = document.querySelector("#statusTable tbody");
          tbody.innerHTML = `<tr><td colspan="11">데이터를 불러오지 못했습니다.</td></tr>`;
        });
    }

    // 페이지 로드 시 부서 목록 로드
    window.onload = () => loadDepartments();
  </script>
</body>
</html>
