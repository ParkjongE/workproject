<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>로그인</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #F4F5F5;
      margin: 0;
      font-family: 'Comfortaa', 'Corben', sans-serif;
    }
    .login-container {
      width: 869px;
      margin: 120px auto 0 auto;
      background: #fff;
      box-shadow: 0px 4px 4px 0px rgba(0,0,0,0.25);
      border-radius: 5px;
      padding: 60px 80px 40px 80px;
      box-sizing: border-box;
      position: relative;
    }
    .logo {
      text-align: center;
      font-family: 'Comfortaa', sans-serif;
      font-size: 28px;
      color: #000;
      margin-bottom: 60px;
      letter-spacing: -1.5%;
    }
    .login-title {
      text-align: center;
      font-family: 'Corben', sans-serif;
      font-size: 24px;
      color: #757678;
      margin-bottom: 40px;
    }
    .input-label {
      font-family: 'Comfortaa', sans-serif;
      font-size: 18px;
      color: #757678;
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.1em;
    }
    .login-input {
      width: 100%;
      height: 48px;
      border: 1px solid #757678;
      border-radius: 5px;
      font-size: 18px;
      padding: 0 16px;
      margin-bottom: 24px;
      box-sizing: border-box;
      font-family: 'Comfortaa', sans-serif;
    }
    .login-btn {
      width: 100%;
      height: 56px;
      background: #218838;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 24px;
      font-family: 'Comfortaa', sans-serif;
      font-weight: 400;
      cursor: pointer;
      margin-top: 16px;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #17692a;
    }
    .login-links {
      text-align: center;
      font-size: 11px;
      color: #757678;
      font-family: 'Comfortaa', sans-serif;
      margin-top: 20px;
    }
    .login-links a {
      color: #757678;
      text-decoration: none;
      margin: 0 8px;
    }
    @media (max-width: 1000px) {
      .login-container {
        width: 95vw;
        padding: 30px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">project</div>
    <div class="login-title">로그인</div>
    <form id="loginForm">
      <label class="input-label" for="userid">아이디</label>
      <input class="login-input" type="text" id="userid" name="userid" placeholder="아이디를 입력하세요" autocomplete="username">
      <label class="input-label" for="password">비밀번호</label>
      <input class="login-input" type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
      <button class="login-btn" type="submit">로그인</button>
    </form>
    <div class="login-links">
      <a href="#">아이디 찾기</a> |
      <a href="#">비밀번호 찾기</a> |
      <a href="#">회원가입</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = '/commute';
    });
  </script>
</body>
</html>
